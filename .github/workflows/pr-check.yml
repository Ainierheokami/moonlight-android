name: PR Check

on:
  pull_request:

jobs:
  check:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (v6 caching is proprietary)

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Normalize CI Gradle properties
        run: |
          sed -i '/^systemProp\.http\.proxy/d' gradle.properties
          sed -i '/^systemProp\.https\.proxy/d' gradle.properties

      - run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testNonRootDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintNonRootDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-nonRootDebug.html
          if-no-files-found: ignore
          retention-days: 5
