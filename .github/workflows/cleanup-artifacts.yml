name: Clean up old artifacts

# Artifacts count toward Actions storage. New uploads already expire after a few days
# (retention-days in the other workflows); this also removes anything older that is left,
# e.g. artifacts uploaded before those limits existed.
on:
  schedule:
    - cron: '17 3 * * 1'   # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      keep_days:
        description: Delete artifacts older than this many days
        default: '7'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete expired artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_DAYS: ${{ github.event.inputs.keep_days || '7' }}
        run: |
          cutoff="$(date -u -d "-${KEEP_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deleting artifacts created before $cutoff"
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .created_at < \"$cutoff\") | \"\(.id) \(.size_in_bytes) \(.name)\"" \
            > old-artifacts.txt
          count=0
          bytes=0
          while read -r id size name; do
            [ -z "$id" ] && continue
            echo "delete #$id $name ($size bytes)"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            count=$((count + 1))
            bytes=$((bytes + size))
          done < old-artifacts.txt
          echo "Deleted $count artifacts, $((bytes / 1024 / 1024)) MiB freed" | tee -a "$GITHUB_STEP_SUMMARY"
